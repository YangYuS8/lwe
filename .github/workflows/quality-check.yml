name: Quality Check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate workflow syntax
        run: |
          actionlint_dir="$RUNNER_TEMP/lwe-actionlint"
          mkdir -p "$actionlint_dir"
          curl -fsSL --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$actionlint_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $actionlint_dir/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$actionlint_dir/actionlint.tar.gz" -C "$actionlint_dir" actionlint
          # actionlint 1.7.12 predates GitHub's queue field. Validate that exact
          # CNB configuration separately; keep every other workflow strict.
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          text = Path('.github/workflows/sync-cnb.yml').read_text()
          expected = '\nconcurrency:\n  group: cnb-sync\n  cancel-in-progress: false\n  queue: max\n'
          if expected not in text or len(re.findall(r'^\s*concurrency:', text, re.M)) != 1 or len(re.findall(r'^\s*queue:', text, re.M)) != 1:
              raise SystemExit('CNB sync must use one global, non-canceling queue:max')
          PYTHON
          for workflow in .github/workflows/*.yml; do
            if [ "$workflow" = '.github/workflows/sync-cnb.yml' ]; then
              "$actionlint_dir/actionlint" -shellcheck='' -pyflakes='' \
                -ignore '^unexpected key "queue" for "concurrency" section' "$workflow"
            else
              "$actionlint_dir/actionlint" -shellcheck='' -pyflakes='' "$workflow"
            fi
          done

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libmpv-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            squashfs-tools \
            desktop-file-utils \
            file

      - name: Test release helpers
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
          pnpm --version

      - name: Read Rust toolchain
        id: toolchain
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"channel={toolchain['channel']}\n")
              output.write(f"components={','.join(toolchain.get('components', []))}\n")
          PYTHON

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ steps.toolchain.outputs.components }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SvelteKit config
        run: pnpm exec svelte-kit sync

      - name: Run frontend type checks
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Build documentation
        run: pnpm docs:build

      - name: Run Rust format check
        run: cargo fmt --all -- --check

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust checks
        run: cargo check --workspace --locked

      - name: Run Rust tests
        run: cargo test --workspace --locked
