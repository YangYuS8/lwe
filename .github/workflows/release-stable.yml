name: Release Stable

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libmpv-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Tauri CLI binary
        uses: actions/cache@v5
        with:
          path: /home/runner/.cargo/bin/tauri
          key: ${{ runner.os }}-tauri-cli-v2

      - name: Install Tauri CLI
        run: |
          if ! command -v tauri >/dev/null 2>&1; then
            cargo install tauri-cli --locked
          fi

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]\+\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag version ($tag_version) does not match Cargo workspace version ($cargo_version)"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        run: cargo tauri build -b "deb,rpm,appimage"

      - name: Collect artifacts
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p dist
          deb_files=(target/release/bundle/deb/*.deb src-tauri/target/release/bundle/deb/*.deb)
          rpm_files=(target/release/bundle/rpm/*.rpm src-tauri/target/release/bundle/rpm/*.rpm)
          appimage_files=(target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/appimage/*.AppImage)

          if [ "${#deb_files[@]}" -eq 0 ] || [ "${#rpm_files[@]}" -eq 0 ] || [ "${#appimage_files[@]}" -eq 0 ]; then
            echo "Expected bundle artifacts not found"
            echo "deb: ${#deb_files[@]}, rpm: ${#rpm_files[@]}, appimage: ${#appimage_files[@]}"
            exit 1
          fi

          cp -v "${deb_files[@]}" dist/
          cp -v "${rpm_files[@]}" dist/
          cp -v "${appimage_files[@]}" dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stable-bundles
          path: dist/*

  publish-release:
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write

    steps:
      - name: Checkout source for release notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: stable-bundles
          path: dist

      - name: Generate release notes
        run: scripts/generate-release-notes.sh "LWE v${{ needs.build-release.outputs.version }}" release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: LWE v${{ needs.build-release.outputs.version }}
          body_path: release-notes.md
          files: dist/*

  publish-aur-stable:
    runs-on: ubuntu-latest
    needs:
      - build-release
      - publish-release

    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssh-client

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Sync AUR stable package metadata
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]\+\)"$/\1/p' Cargo.toml | head -n 1)"
          sed -i "s/^pkgver=.*/pkgver=${cargo_version}/" packaging/aur/lwe/PKGBUILD
          sed -i "s|^source=.*|source=(\"lwe_${cargo_version}_amd64.deb::https://github.com/YangYuS8/lwe/releases/download/v${cargo_version}/lwe_${cargo_version}_amd64.deb\")|" packaging/aur/lwe/PKGBUILD
          sed -i "s/^pkgver = .*/pkgver = ${cargo_version}/" packaging/aur/lwe/.SRCINFO
          sed -i "s|^\s*source = .*|\tsource = lwe_${cargo_version}_amd64.deb::https://github.com/YangYuS8/lwe/releases/download/v${cargo_version}/lwe_${cargo_version}_amd64.deb|" packaging/aur/lwe/.SRCINFO

      - name: Setup SSH configuration
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          scripts/publish-aur-package.sh \
            packaging/aur/lwe \
            lwe \
            "chore: release lwe ${GITHUB_REF_NAME#v}"

  publish-archlinuxcn-stable:
    runs-on: ubuntu-latest
    needs:
      - build-release
      - publish-release

    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Prepare ArchLinuxCN stable package PR payload
        shell: bash
        run: |
          release_version="${{ needs.build-release.outputs.version }}"
          body_file="dist/archlinuxcn-lwe-pr.md"

          scripts/prepare-archlinuxcn-package.sh stable "${release_version}" dist/archlinuxcn

          cat > "${body_file}" <<EOF
          Update LWE stable package metadata for ${{ github.ref_name }}.

          This PR payload was generated from ${{ github.repository }}@${{ github.sha }}.
          EOF

      - name: Open ArchLinuxCN stable package PR
        env:
          ARCHLINUXCN_GITHUB_TOKEN: ${{ secrets.ARCHLINUXCN_GITHUB_TOKEN }}
          ARCHLINUXCN_REPO_FORK: ${{ secrets.ARCHLINUXCN_REPO_FORK }}
          ARCHLINUXCN_REPO_UPSTREAM: ${{ vars.ARCHLINUXCN_REPO_UPSTREAM }}
          ARCHLINUXCN_REPO_BASE_BRANCH: ${{ vars.ARCHLINUXCN_REPO_BASE_BRANCH }}
        shell: bash
        run: |
          if [ -z "${ARCHLINUXCN_GITHUB_TOKEN:-}" ] || [ -z "${ARCHLINUXCN_REPO_FORK:-}" ]; then
            echo "ARCHLINUXCN_GITHUB_TOKEN or ARCHLINUXCN_REPO_FORK is not configured; skipping ArchLinuxCN stable package PR."
            exit 0
          fi

          scripts/open-archlinuxcn-pr.sh \
            dist/archlinuxcn \
            lwe \
            "lwe-${{ needs.build-release.outputs.version }}" \
            "lwe: update to ${{ needs.build-release.outputs.version }}" \
            "lwe: update to ${{ needs.build-release.outputs.version }}" \
            dist/archlinuxcn-lwe-pr.md
