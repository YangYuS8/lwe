name: Release Stable

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: appimage
            runner: ubuntu-22.04
            bundles: appimage
            extensions: AppImage
          - kind: native
            runner: ubuntu-24.04
            bundles: deb,rpm
            extensions: deb rpm
    # AppImage needs the older glibc baseline; native packages retain libmpv.so.2.
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libmpv-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            squashfs-tools \
            desktop-file-utils \
            file

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
          pnpm --version

      - name: Read Rust toolchain
        id: toolchain
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"channel={toolchain['channel']}\n")
              output.write(f"components={','.join(toolchain.get('components', []))}\n")
          PYTHON

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ steps.toolchain.outputs.components }}

      - name: Read Tauri CLI version
        id: tauri-cli
        run: |
          tauri_version="$(bash scripts/ensure-tauri-cli.sh --version)"
          echo "version=$tauri_version" >> "$GITHUB_OUTPUT"
          cli_root="$RUNNER_TEMP/lwe-tauri-cli"
          echo "CARGO_INSTALL_ROOT=$cli_root" >> "$GITHUB_ENV"
          echo "$cli_root/bin" >> "$GITHUB_PATH"

      - name: Cache Tauri CLI binary
        uses: actions/cache@v5
        with:
          path: ${{ env.CARGO_INSTALL_ROOT }}/bin/cargo-tauri
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-tauri-cli-${{ steps.tauri-cli.outputs.version }}-rust-${{ steps.toolchain.outputs.channel }}

      - name: Ensure exact Tauri CLI version
        run: bash scripts/ensure-tauri-cli.sh

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.runner }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]\+\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag version ($tag_version) does not match Cargo workspace version ($cargo_version)"
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        run: |
          # Rust caches may contain bundles from another release.
          rm -rf target/release/bundle src-tauri/target/release/bundle dist
          cargo tauri build -b "${{ matrix.bundles }}" -- --locked

      - name: Collect artifacts
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p dist
          for extension in ${{ matrix.extensions }}; do
            bundle_dir="${extension,,}"
            files=(target/release/bundle/"$bundle_dir"/*."$extension" src-tauri/target/release/bundle/"$bundle_dir"/*."$extension")
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected exactly one $extension bundle, found ${#files[@]}"
              exit 1
            fi
            cp -v "${files[@]}" dist/
          done

      - name: Validate AppImage artifacts
        if: matrix.kind == 'appimage'
        run: |
          python3 scripts/validate-appimage.py dist/*.AppImage
          sha256sum dist/*.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stable-bundles-${{ matrix.kind }}
          path: dist/*

  publish-release:
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: write

    steps:
      - name: Checkout source for release notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.build-release.outputs.source_sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: stable-bundles-*
          merge-multiple: true
          path: dist

      - name: Generate release notes
        run: scripts/generate-release-notes.sh "LWE v${{ needs.build-release.outputs.version }}" release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: LWE v${{ needs.build-release.outputs.version }}
          target_commitish: ${{ needs.build-release.outputs.source_sha }}
          body_path: release-notes.md
          files: dist/*

  publish-aur-stable:
    runs-on: ubuntu-latest
    needs:
      - build-release
      - publish-release

    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssh-client

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-release.outputs.source_sha }}

      - name: Sync AUR stable package metadata
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]\+\)"$/\1/p' Cargo.toml | head -n 1)"
          sed -i "s/^pkgver=.*/pkgver=${cargo_version}/" packaging/aur/lwe/PKGBUILD
          sed -i "s/^license=.*/license=('Apache-2.0')/" packaging/aur/lwe/PKGBUILD
          sed -i "s|^source=.*|source=(\"lwe_${cargo_version}_amd64.deb::https://github.com/YangYuS8/lwe/releases/download/v${cargo_version}/lwe_${cargo_version}_amd64.deb\")|" packaging/aur/lwe/PKGBUILD
          sed -i "s/^[[:space:]]*pkgver = .*/\tpkgver = ${cargo_version}/" packaging/aur/lwe/.SRCINFO
          sed -i "s/^[[:space:]]*license = .*/\tlicense = Apache-2.0/" packaging/aur/lwe/.SRCINFO
          sed -i "s|^[[:space:]]*source = .*|\tsource = lwe_${cargo_version}_amd64.deb::https://github.com/YangYuS8/lwe/releases/download/v${cargo_version}/lwe_${cargo_version}_amd64.deb|" packaging/aur/lwe/.SRCINFO

      - name: Setup SSH configuration
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          scripts/publish-aur-package.sh \
            packaging/aur/lwe \
            lwe \
            "chore: release lwe ${GITHUB_REF_NAME#v}"

  publish-archlinuxcn-stable:
    runs-on: ubuntu-latest
    needs:
      - build-release
      - publish-release

    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-release.outputs.source_sha }}

      - name: Prepare ArchLinuxCN stable package PR payload
        shell: bash
        run: |
          release_version="${{ needs.build-release.outputs.version }}"
          body_file="dist/archlinuxcn-lwe-pr.md"

          scripts/prepare-archlinuxcn-package.sh stable "${release_version}" dist/archlinuxcn

          cat > "${body_file}" <<EOF
          Update LWE stable package metadata for ${{ github.ref_name }}.

          This PR payload was generated from ${{ github.repository }}@${{ github.sha }}.
          EOF

      - name: Open ArchLinuxCN stable package PR
        env:
          ARCHLINUXCN_GITHUB_TOKEN: ${{ secrets.ARCHLINUXCN_GITHUB_TOKEN }}
          ARCHLINUXCN_REPO_FORK: ${{ secrets.ARCHLINUXCN_REPO_FORK }}
          ARCHLINUXCN_REPO_UPSTREAM: ${{ vars.ARCHLINUXCN_REPO_UPSTREAM }}
          ARCHLINUXCN_REPO_BASE_BRANCH: ${{ vars.ARCHLINUXCN_REPO_BASE_BRANCH }}
        shell: bash
        run: |
          if [ -z "${ARCHLINUXCN_GITHUB_TOKEN:-}" ] || [ -z "${ARCHLINUXCN_REPO_FORK:-}" ]; then
            echo "ARCHLINUXCN_GITHUB_TOKEN or ARCHLINUXCN_REPO_FORK is not configured; skipping ArchLinuxCN stable package PR."
            exit 0
          fi

          scripts/open-archlinuxcn-pr.sh \
            dist/archlinuxcn \
            lwe \
            "lwe-${{ needs.build-release.outputs.version }}" \
            "lwe: update to ${{ needs.build-release.outputs.version }}" \
            "lwe: update to ${{ needs.build-release.outputs.version }}" \
            dist/archlinuxcn-lwe-pr.md

  publish-cnb:
    needs:
      - build-release
      - publish-release
    uses: ./.github/workflows/sync-cnb.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ github.ref_name }}
      expected_source_sha: ${{ needs.build-release.outputs.source_sha }}
    secrets: inherit
