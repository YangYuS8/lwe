name: Release Prerelease

on:
  workflow_run:
    workflows:
      - Quality Check
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: release-prerelease
  cancel-in-progress: false

jobs:
  build-prerelease:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: appimage
            runner: ubuntu-22.04
            bundles: appimage
            extensions: AppImage
          - kind: native
            runner: ubuntu-24.04
            bundles: deb,rpm
            extensions: deb rpm
    # AppImage needs the older glibc baseline; native packages retain libmpv.so.2.
    runs-on: ${{ matrix.runner }}
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      prerelease_version: ${{ steps.version.outputs.prerelease_version }}
      prerelease_tag: ${{ steps.version.outputs.prerelease_tag }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      source_sha: ${{ steps.version.outputs.source_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libmpv-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            squashfs-tools \
            desktop-file-utils \
            file

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
          pnpm --version

      - name: Read Rust toolchain
        id: toolchain
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          toolchain = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"channel={toolchain['channel']}\n")
              output.write(f"components={','.join(toolchain.get('components', []))}\n")
          PYTHON

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ steps.toolchain.outputs.components }}

      - name: Read Tauri CLI version
        id: tauri-cli
        run: |
          tauri_version="$(bash scripts/ensure-tauri-cli.sh --version)"
          echo "version=$tauri_version" >> "$GITHUB_OUTPUT"
          cli_root="$RUNNER_TEMP/lwe-tauri-cli"
          echo "CARGO_INSTALL_ROOT=$cli_root" >> "$GITHUB_ENV"
          echo "$cli_root/bin" >> "$GITHUB_PATH"

      - name: Cache Tauri CLI binary
        uses: actions/cache@v5
        with:
          path: ${{ env.CARGO_INSTALL_ROOT }}/bin/cargo-tauri
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.runner }}-tauri-cli-${{ steps.tauri-cli.outputs.version }}-rust-${{ steps.toolchain.outputs.channel }}

      - name: Ensure exact Tauri CLI version
        run: bash scripts/ensure-tauri-cli.sh

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.runner }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve prerelease version
        id: version
        shell: bash
        run: |
          base_version="$(sed -n 's/^version = "\([^"]\+\)"$/\1/p' Cargo.toml | head -n 1)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          source_sha="$(git rev-parse HEAD)"
          prerelease_version="${base_version}-beta.${GITHUB_RUN_NUMBER}+${short_sha}"
          prerelease_tag="v${prerelease_version}"

          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "prerelease_version=${prerelease_version}" >> "$GITHUB_OUTPUT"
          echo "prerelease_tag=${prerelease_tag}" >> "$GITHUB_OUTPUT"

      - name: Build bundles
        run: |
          # Rust caches may contain bundles from another release.
          rm -rf target/release/bundle src-tauri/target/release/bundle dist
          cargo tauri build -b "${{ matrix.bundles }}" -- --locked

      - name: Collect artifacts
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p dist
          for extension in ${{ matrix.extensions }}; do
            bundle_dir="${extension,,}"
            files=(target/release/bundle/"$bundle_dir"/*."$extension" src-tauri/target/release/bundle/"$bundle_dir"/*."$extension")
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected exactly one $extension bundle, found ${#files[@]}"
              exit 1
            fi
            cp -v "${files[@]}" dist/
          done

      - name: Validate AppImage artifacts
        if: matrix.kind == 'appimage'
        run: |
          python3 scripts/validate-appimage.py dist/*.AppImage
          sha256sum dist/*.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: prerelease-bundles-${{ matrix.kind }}
          path: dist/*

  publish-github-prerelease:
    runs-on: ubuntu-latest
    needs: build-prerelease
    permissions:
      contents: write

    steps:
      - name: Checkout source for release notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.build-prerelease.outputs.source_sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: prerelease-bundles-*
          merge-multiple: true
          path: dist

      - name: Generate release notes
        run: scripts/generate-release-notes.sh "LWE ${{ needs.build-prerelease.outputs.prerelease_version }}" release-notes.md

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-prerelease.outputs.prerelease_tag }}
          name: LWE ${{ needs.build-prerelease.outputs.prerelease_version }}
          target_commitish: ${{ needs.build-prerelease.outputs.source_sha }}
          prerelease: true
          body_path: release-notes.md
          files: dist/*

      - name: Delete older prereleases for same commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target_sha="${{ needs.build-prerelease.outputs.source_sha }}"
          current_tag="${{ needs.build-prerelease.outputs.prerelease_tag }}"

          gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | select(.prerelease == true) | [.id, .tag_name, .target_commitish] | @tsv' |
          while IFS=$'\t' read -r release_id tag_name target_commitish; do
            if [ "$target_commitish" = "$target_sha" ] && [ "$tag_name" != "$current_tag" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/${release_id}"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${tag_name}" || true
            fi
          done

  publish-aur-git:
    runs-on: ubuntu-latest
    needs:
      - build-prerelease
      - publish-github-prerelease

    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssh-client

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-prerelease.outputs.source_sha }}

      - name: Update AUR dev package metadata
        shell: bash
        run: |
          short_sha="${{ needs.build-prerelease.outputs.short_sha }}"
          base_version="${{ needs.build-prerelease.outputs.base_version }}"
          aur_pkgver="${base_version}.beta.${GITHUB_RUN_NUMBER}.${short_sha}"
          sed -i "s/^pkgver=.*/pkgver=${aur_pkgver}/" packaging/aur/lwe-git/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/aur/lwe-git/PKGBUILD
          sed -i "s/^license=.*/license=('Apache-2.0')/" packaging/aur/lwe-git/PKGBUILD
          sed -i "s/^[[:space:]]*pkgver = .*/\tpkgver = ${aur_pkgver}/" packaging/aur/lwe-git/.SRCINFO
          sed -i "s/^[[:space:]]*pkgrel = .*/\tpkgrel = 1/" packaging/aur/lwe-git/.SRCINFO
          sed -i "s/^[[:space:]]*license = .*/\tlicense = Apache-2.0/" packaging/aur/lwe-git/.SRCINFO

      - name: Setup SSH configuration
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          scripts/publish-aur-package.sh \
            packaging/aur/lwe-git \
            lwe-git \
            "chore: prerelease ${{ needs.build-prerelease.outputs.prerelease_version }}"
