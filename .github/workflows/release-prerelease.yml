name: Release Prerelease

on:
  workflow_run:
    workflows:
      - Quality Check
    branches: [main]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: release-prerelease
  cancel-in-progress: false

jobs:
  resolve-prerelease:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      prerelease_version: ${{ steps.version.outputs.prerelease_version }}
      prerelease_tag: ${{ steps.version.outputs.prerelease_tag }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      source_sha: ${{ steps.version.outputs.source_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Resolve prerelease version
        id: version
        shell: bash
        run: |
          base_version="$(sed -n 's/^version = "\([^"]\+\)"$/\1/p' Cargo.toml | head -n 1)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          source_sha="$(git rev-parse HEAD)"
          prerelease_version="${base_version}-beta.${GITHUB_RUN_NUMBER}+${short_sha}"
          prerelease_tag="v${prerelease_version}"

          echo "base_version=${base_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "prerelease_version=${prerelease_version}" >> "$GITHUB_OUTPUT"
          echo "prerelease_tag=${prerelease_tag}" >> "$GITHUB_OUTPUT"

  build-prerelease:
    needs: resolve-prerelease
    permissions:
      contents: read
    uses: ./.github/workflows/build-bundles.yml
    with:
      source_ref: ${{ needs.resolve-prerelease.outputs.source_sha }}
      artifact_prefix: prerelease-bundles

  publish-github-prerelease:
    runs-on: ubuntu-latest
    needs: [resolve-prerelease, build-prerelease]
    permissions:
      contents: write

    steps:
      - name: Checkout source for release notes
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-prerelease.outputs.source_sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: prerelease-bundles-*
          merge-multiple: true
          path: dist

      - name: Generate release notes
        run: scripts/generate-release-notes.sh "LWE ${{ needs.resolve-prerelease.outputs.prerelease_version }}" release-notes.md

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-prerelease.outputs.prerelease_tag }}
          name: LWE ${{ needs.resolve-prerelease.outputs.prerelease_version }}
          target_commitish: ${{ needs.resolve-prerelease.outputs.source_sha }}
          prerelease: true
          body_path: release-notes.md
          files: dist/*

      - name: Delete older prereleases for same commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target_sha="${{ needs.resolve-prerelease.outputs.source_sha }}"
          current_tag="${{ needs.resolve-prerelease.outputs.prerelease_tag }}"

          gh api repos/${{ github.repository }}/releases --paginate --jq '.[] | select(.prerelease == true) | [.id, .tag_name, .target_commitish] | @tsv' |
          while IFS=$'\t' read -r release_id tag_name target_commitish; do
            if [ "$target_commitish" = "$target_sha" ] && [ "$tag_name" != "$current_tag" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/releases/${release_id}"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${tag_name}" || true
            fi
          done

  publish-aur-git:
    runs-on: ubuntu-latest
    needs:
      - resolve-prerelease
      - build-prerelease
      - publish-github-prerelease

    steps:
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git openssh-client

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-prerelease.outputs.source_sha }}

      - name: Update AUR dev package metadata
        shell: bash
        run: |
          short_sha="${{ needs.resolve-prerelease.outputs.short_sha }}"
          base_version="${{ needs.resolve-prerelease.outputs.base_version }}"
          aur_pkgver="${base_version}.beta.${GITHUB_RUN_NUMBER}.${short_sha}"
          sed -i "s/^pkgver=.*/pkgver=${aur_pkgver}/" packaging/aur/lwe-git/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/aur/lwe-git/PKGBUILD
          sed -i "s/^license=.*/license=('Apache-2.0')/" packaging/aur/lwe-git/PKGBUILD
          sed -i "s/^[[:space:]]*pkgver = .*/\tpkgver = ${aur_pkgver}/" packaging/aur/lwe-git/.SRCINFO
          sed -i "s/^[[:space:]]*pkgrel = .*/\tpkgrel = 1/" packaging/aur/lwe-git/.SRCINFO
          sed -i "s/^[[:space:]]*license = .*/\tlicense = Apache-2.0/" packaging/aur/lwe-git/.SRCINFO

      - name: Setup SSH configuration
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          scripts/publish-aur-package.sh \
            packaging/aur/lwe-git \
            lwe-git \
            "chore: prerelease ${{ needs.resolve-prerelease.outputs.prerelease_version }}"

  publish-cnb:
    needs:
      - resolve-prerelease
      - build-prerelease
      - publish-github-prerelease
    uses: ./.github/workflows/sync-cnb.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ needs.resolve-prerelease.outputs.prerelease_tag }}
      expected_source_sha: ${{ needs.resolve-prerelease.outputs.source_sha }}
    secrets: inherit
