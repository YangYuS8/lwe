$:
  api_trigger_docs:
    - name: deploy-docs-edgeone-pages
      runner:
        cpus: 64
      docker:
        image: node:24-bookworm
        volumes:
          - pnpm-store:/root/.local/share/pnpm/store:rw
      imports:
        - https://cnb.cool/Nesoriel/secret-prod/-/blob/main/cloud-providers/tencent-cloud.yml
      stages:
        - name: install dependencies
          script: |
            corepack enable
            corepack prepare pnpm@11.1.3 --activate
            pnpm install --frozen-lockfile
        - name: build documentation
          script: VITEPRESS_BASE=/ pnpm docs:build
        - name: deploy to EdgeOne Pages
          script: |
            if [ -z "${EDGEONE_PAGES_API_TOKEN:-}" ]; then
              echo "EDGEONE_PAGES_API_TOKEN is not configured; skipping EdgeOne Pages deployment."
              exit 0
            fi

            edgeone_project="${EDGEONE_PAGES_PROJECT:-lwe-docs}"
            npx --yes edgeone@latest pages deploy docs/.vitepress/dist \
              -n "${edgeone_project}" \
              -t "${EDGEONE_PAGES_API_TOKEN}" \
              -e production
