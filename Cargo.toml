# Active LWE desktop workspace: the Tauri shell and shared core, library, and
# Wayland runtime crates. Retired wayvid GUI/CLI implementations remain in Git
# history, not in the active workspace.

[workspace]
resolver = "2"
members = [
    "crates/lwe-core",
    "crates/lwe-engine",
    "crates/lwe-library",
    "src-tauri",
]

[workspace.package]
version = "0.9.10"
edition = "2024"
rust-version = "1.90"
authors = ["LWE contributors"]
license = "Apache-2.0"
repository = "https://github.com/YangYuS8/lwe"

# Shared dependency versions (workspace.dependencies)
[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"

# Async
tokio = { version = "1.52", features = ["sync", "rt-multi-thread"] }

# Testing
tempfile = "3.8"

# Optimized release profile (based on Rust Performance Book)
[profile.release]
opt-level = 3              # Maximum optimization
lto = "thin"              # Link-Time Optimization (thin = faster build, fat = smaller binary)
codegen-units = 1          # Single codegen unit for maximum optimization
strip = true               # Strip symbols for smaller binary size
panic = "abort"            # Smaller binary, faster unwinding

# Alternative ultra-optimized profile (use with: cargo build --profile release-opt)
# Trades longer compile time for maximum runtime performance
[profile.release-opt]
inherits = "release"
lto = "fat"               # Full LTO for maximum optimization
opt-level = 3
codegen-units = 1

[profile.dev]
opt-level = 1
